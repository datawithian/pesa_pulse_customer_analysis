[project]
name = "pesa-pulse-customer-analysis"
version = "0.1.0"
description = "Python analysis of a customer directory fetched from an API: explores nested JSON, counts customers by city and email domain with sets and dicts, cross-checks with pandas, and charts the results."
readme = "README.md"
authors = [
    { name = "Ian", email = "githuian94@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "requests>=2.34.2",
]

[project.scripts]
pesa-pulse-customer-analysis = "pesa_pulse_customer_analysis:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
